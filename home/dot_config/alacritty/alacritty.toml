# ==============================================================================
# Alacritty — the Linux terminal (macOS uses Ghostty)
# DaikieJP - 2026
#
# Kept deliberately close to home/dot_config/ghostty/config.tmpl so both
# terminals look the same. Alacritty takes a single font family and leans on
# fontconfig for glyph fallback, so JetBrainsMono Nerd Font covers the icons
# Cascadia does not ship.
#
# Cascadia Code has no Linux package: restore.sh from ~/dotfiles-private
# installs it from fonts-linux/.
# ==============================================================================

[window]
opacity = 0.8
decorations = "none"

[font]
size = 22          # normal: 18 | streaming: 22

[font.normal]
family = "Cascadia Code"
style = "Regular"

[font.bold]
family = "Cascadia Code"
style = "Bold"

[font.italic]
family = "Cascadia Code"
style = "Italic"

[terminal.shell]
program = "zsh"
